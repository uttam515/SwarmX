syntax = "proto3";

package swarmx.v1;

enum ThermalState {
  THERMAL_STATE_NOMINAL = 0;
  THERMAL_STATE_FAIR = 1;
  THERMAL_STATE_SERIOUS = 2;
  THERMAL_STATE_CRITICAL = 3;
}

message CapabilityProfile {
  int32 capability_schema_version = 1; // Explicitly versioned (current: 1)
  string device_id = 2;
  string device_name = 3;
  string os_type = 4; // e.g. "darwin", "windows", "linux"
  string os_version = 5;
  string cpu_arch = 6; // e.g. "arm64", "x86_64"
  int32 cpu_cores = 7;
  int64 total_ram_mb = 8;
  bool has_gpu = 9;
  string gpu_model = 10;
}

message WorkerTelemetry {
  string device_id = 1;
  int64 timestamp_ms = 2;
  float battery_level = 3; // 0.0 - 1.0
  bool is_charging = 4;
  ThermalState thermal_state = 5;
  float cpu_utilization = 6; // 0.0 - 1.0
  int64 available_ram_mb = 7;
  bool is_eligible = 8; // Evaluated by Worker Manager gate
}
